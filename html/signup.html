<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.ico" />

    <!-- common.css 추가 -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/account.css" />

    <!-- 비밀번호 showing clickEvent -->
    <script src="/js/login_password_showing.js"></script>

    <!-- pretendard cdn -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- normalize.css CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- fontAwsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <title>signup</title>
  </head>
  <body>
    <div class="login-page">
      <div class="form">
        <img src="/images/panda-market-logo.png" alt="판다마켓 이미지" class="form-image" onclick="goHomepage()" />
        <!-- 회원 가입 폼 -->
        <form class="submit-form">
          <!-- 이메일 -->
          <label for="submit-email">
            이메일
            <input type="text" name="userEmail" placeholder="codeit@email.com" id="form-email" />
          </label>

          <!-- 닉네임 -->
          <label for="submit-name">
            닉네임
            <input type="text" name="userName" placeholder="panda" id="form-name" />
          </label>

          <!-- 패스워드 -->
          <label for="form-password"
            >비밀번호
            <div class="password-box">
              <input type="password" name="userPassword" placeholder="password" id="form-password" />
              <!-- fontawesome 비밀번호 표시 -->
              <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('form-password', this)"></i>
            </div>
          </label>

          <!-- 비밀번호 확인 -->
          <label for="form-password-check"
            >비밀번호확인
            <div class="password-box">
              <input type="password" name="userPassword" placeholder="password" id="form-password-check" />
              <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('form-password-check', this)"></i>
            </div>
          </label>

          <button>회원가입</button>

          <!-- 간편 로그인 -->
          <div class="easy-login">
            <span>간편 로그인 하기</span>
            <div class="easy-login-icon">
              <a href="https://www.google.com/"> <img src="/images/login_img/google_img.png" /></a>
              <a href="https://www.kakaocorp.com/page/service/service/KakaoTalk" class="kakao-img"> <img src="/images/login_img/kakako_img.png" /></a>
            </div>
          </div>

          <!-- 최하단 메시지 박스 -->
          <div class="message-box">
            <p class="message">
              이미 회원이신가요?
              <a href="/html/login.html">로그인</a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
