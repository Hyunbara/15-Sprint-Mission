<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.ico" />

    <!-- common.css import -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/account.css" />

    <!-- pretendard cdn -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- normalize.css CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- fontAwsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

    <!-- script import -->
    <script defer src="/js/login_password_showing.js"></script>

    <title>Login</title>
  </head>
  <body>
    <div class="login-page">
      <div class="form">
        <img src="/images/panda-market-logo.png" alt="판다마켓 이미지" class="form-image" />
        <!-- login form -->
        <form class="login-form">
          <!-- email label -->
          <label for="form-email">
            이메일
            <input type="text" name="userEmail" placeholder="codeit@email.com" id="form-email" />
          </label>

          <!-- password label -->
          <label for="form-password">
            비밀번호
            <div class="password-box">
              <input type="password" name="userPassword" placeholder="password" id="form-password" />
              <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('form-password', this)"> </i>
            </div>
          </label>

          <button>로그인</button>
        </form>

        <!-- 간편 로그인 -->
        <div class="easy-login">
          <span>간편 로그인 하기</span>
          <div class="easy-login-icon">
            <a href="https://www.google.com/"> <img src="/images/login_img/google.png" /></a>
            <a href="https://www.kakaocorp.com/page/service/service/KakaoTalk" class="kakao-img"> <img src="/images/login_img/kakako.png" /></a>
          </div>
        </div>
        <!-- 최하단 메시지 요소 -->
        <div class="message-box">
          <p class="message">
            판다마켓이 처음이신가요?
            <a href="/html/signup.html">회원가입</a>
          </p>
        </div>
        <!-- 원래 </form> -->
      </div>
    </div>
  </body>
</html>
