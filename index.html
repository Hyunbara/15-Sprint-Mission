<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph 메타태그 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:url" content="https://hyunbara3.netlify.app/" />
    <meta property="og:image" content="https://hyunbara3.netlify.app/images/panda-market-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card (트위터 공유용) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다 마켓" />
    <meta name="twitter:description" content="일상의 모든 물건을 거래해보세요" />
    <meta name="twitter:image" content="https://hyunbara3.netlify.app/images/panda-market-preview.png" />

    <link rel="icon" href="/images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <!-- common.css 추가 -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/style.css" />

    <!-- normalize.css cdn 이용 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <a href="/">
        <img src="/images/panda-market-logo.png" alt="판다마켓" class="headerImg" />
      </a>
      <a href="/html/login.html" class="loginBtn">로그인</a>
    </header>

    <main>
      <!-- top banner -->
      <section class="contents">
        <div class="content">
          <div class="content-text">
            <h2 class="content-title">
              <span>일상의 모든 물건을</span>
              거래해보세요
            </h2>
            <div class="explore-button-container">
              <a href="/html/items.html" class="contentBtn">구경하러 가기</a>
            </div>
          </div>
          <img src="/images/section_panda.png" alt="일상의 모든 물건을 거래해보세요" class="contentImg" />
        </div>
      </section>

      <!-- main contents -->
      <section class="mainContents">
        <!-- content1 -->
        <div class="mainContent">
          <img src="/images/main_content_img1.png" alt="메인사진1" class="mainContentImg" />
          <div class="imageText">
            <h4>Hot item</h4>
            <h2>
              인기 상품을 <br />
              확인해 보세요
            </h2>
            <p>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해보세요</p>
          </div>
        </div>

        <!-- content2 -->
        <div class="mainContent_even">
          <img src="/images/main_content_img2.png" alt="메인사진2" class="mainContentImg" />
          <div class="imageText">
            <h4>Search</h4>
            <h2>
              구매를 원하는 <br />
              상품을 검색하세요
            </h2>
            <p>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</p>
          </div>
        </div>

        <!-- content3 -->
        <div class="mainContent">
          <img src="/images/main_content_img3.png" alt="메인사진3" class="mainContentImg" />
          <div class="imageText">
            <h4>Register</h4>
            <h2>
              판매를 원하는 <br />
              상품을 등록하세요
            </h2>
            <p>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</p>
          </div>
        </div>
      </section>

      <!-- bottom banner  -->
      <section class="contents">
        <div class="content">
          <div class="content-text">
            <h2 class="content-title" style="text-align: center">
              <span>믿을 수 있는 </span><br />
              판다마켓 중고거래
            </h2>
          </div>
          <img src="/images/footer_content_panda.png" alt="믿을 수 있는 판다마켓 중고거래" class="contentImg" />
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer>
      <div class="footerContents">
        <span>©codeit - 2024</span>
        <div class="footerPolicy">
          <a href="/html/privacy.html">Privacy Policy</a>
          <a href="/html/faq.html">FAQ</a>
        </div>

        <!-- 관련된 요소들끼리 묶은 ul태그로 수정 -->
        <ul class="footerSns">
          <li>
            <a href="https://www.facebook.com/" target="_blank">
              <img src="/images/svg/facebook-logo.svg" alt="페이스북" />
            </a>
          </li>
          <li>
            <a href="https://x.com/?lang=ko" target="_blank">
              <img src="/images/svg/twitter-logo.svg" alt="x" />
            </a>
          </li>
          <li>
            <a href="https://www.youtube.com/" target="_blank">
              <img src="/images/svg/youtube-logo.svg" alt="유튜브" />
            </a>
          </li>
          <li>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="/images/svg/instagram-logo.svg" alt="인스타그램" />
            </a>
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
